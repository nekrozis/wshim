name: release-publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: release-build workflow run ID
        required: true
      tag:
        description: Tag to publish (for example v0.2.0)
        required: true

permissions:
  contents: write
  actions: read
  attestations: read

jobs:
  publish:
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Show pinned Rust
        shell: pwsh
        run: |
          rustup show

      - name: Download the build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Path downloaded -Force | Out-Null
          gh run download $env:RUN_ID -n "wshim-$env:TAG" -D downloaded
          $run = gh run view $env:RUN_ID --json headBranch,headSha,conclusion,workflowName | ConvertFrom-Json
          if ($run.conclusion -ne 'success') { throw "build run did not succeed" }
          if ($run.workflowName -ne 'release-build') { throw "unexpected build workflow: $($run.workflowName)" }
          $tagSha = (& git rev-parse HEAD).Trim()
          if ($run.headSha -ne $tagSha) { throw "build headSha $($run.headSha) != tag commit $tagSha" }
          Get-ChildItem downloaded | Format-Table -AutoSize

      - name: Verify SHA-256 and manifest
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $manifest = Get-Content downloaded/manifest.json | ConvertFrom-Json
          if ($manifest.tag -ne $env:TAG) { throw "manifest tag mismatch" }
          $expected = @{}
          foreach ($line in Get-Content downloaded/sha256.txt) {
            if ($line -match '^\s*([0-9A-Fa-f]{64})\s+(\S+)\s*$') {
              $expected[$Matches[2]] = $Matches[1].ToUpperInvariant()
            }
          }
          foreach ($name in @('wshim-c.exe', 'wshim-w.exe')) {
            $actual = (Get-FileHash -LiteralPath (Join-Path 'downloaded' $name) -Algorithm SHA256).Hash
            if ($expected[$name] -ne $actual) { throw "sha256 mismatch for $name" }
          }
          Write-Host "sha256 OK"

      - name: Rebuild and compare
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ./.github/scripts/build-wshim.ps1 -Tag $env:TAG -OutputDir rebuilt
          $down = Get-Content downloaded/manifest.json | ConvertFrom-Json
          $reb = Get-Content rebuilt/manifest.json | ConvertFrom-Json
          if ($down.hash_c -ne $reb.hash_c -or $down.hash_w -ne $reb.hash_w) {
            throw "rebuild does not match the build artifact"
          }
          Write-Host "rebuild matches the build artifact"

      - name: Verify attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $manifest = Get-Content downloaded/manifest.json | ConvertFrom-Json
          $signer = "$env:GITHUB_REPOSITORY/.github/workflows/release-build.yml"
          foreach ($name in @('wshim-c.exe', 'wshim-w.exe')) {
            gh attestation verify (Join-Path 'downloaded' $name) `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $signer `
              --source-digest $manifest.commit `
              --source-ref "refs/tags/$env:TAG" `
              --deny-self-hosted-runners
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          $manifest = Get-Content downloaded/manifest.json | ConvertFrom-Json
          $notes = @"
          # wshim $env:TAG

          Official binaries built by the release-build workflow from tag `$env:TAG`.

          - Build run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID
          - Runner: $($manifest.image_os) / $($manifest.image_version)
          - Target: $($manifest.target)
          - Rust: $($manifest.rustc)
          - SHA-256:
            - `wshim-c.exe`: $($manifest.hash_c)
            - `wshim-w.exe`: $($manifest.hash_w)
          - Attestation: `gh attestation verify <file> --repo $env:GITHUB_REPOSITORY --signer-workflow $env:GITHUB_REPOSITORY/.github/workflows/release-build.yml --source-digest $($manifest.commit) --source-ref refs/tags/$env:TAG`

          Reproducibility: the build CI performed A/B builds; this release CI rebuilt and compared. This is same-image, best-effort reproducibility; cross-environment bit-for-bit identity is not guaranteed.

          This is the Rust rewrite; v1.x is the old C++ shim.
          "@
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release create $env:TAG --draft --verify-tag --title "wshim $env:TAG" --notes-file release-notes.md `
            downloaded/wshim-c.exe downloaded/wshim-w.exe downloaded/sha256.txt downloaded/manifest.json
